name: Nix package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build from"
        required: false
        type: string
      systems:
        description: "Which systems to build on"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.systems == 'linux' && '[{"system":"x86_64-linux","os":"ubuntu-latest"},{"system":"aarch64-linux","os":"ubuntu-24.04-arm"}]' || inputs.systems == 'macos' && '[{"system":"aarch64-darwin","os":"macos-latest"}]' || inputs.systems == 'x86_64-linux' && '[{"system":"x86_64-linux","os":"ubuntu-latest"}]' || inputs.systems == 'aarch64-linux' && '[{"system":"aarch64-linux","os":"ubuntu-24.04-arm"}]' || inputs.systems == 'aarch64-darwin' && '[{"system":"aarch64-darwin","os":"macos-latest"}]' || '[{"system":"x86_64-linux","os":"ubuntu-latest"},{"system":"aarch64-linux","os":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","os":"macos-latest"}]') }}

    env:
      NIX_PATH: nixpkgs=channel:nixos-unstable

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: tsirysndr
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build nix/package.nix
        run: nix-build -E 'with import <nixpkgs> { }; callPackage ./nix/package.nix { }' --no-out-link

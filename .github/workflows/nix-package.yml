name: Nix package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build from"
        required: false
        type: string
      systems:
        description: "Which systems to build on"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.systems == 'linux' && '[{"system":"x86_64-linux","os":"ubuntu-latest"},{"system":"aarch64-linux","os":"ubuntu-24.04-arm"}]' || inputs.systems == 'macos' && '[{"system":"aarch64-darwin","os":"macos-latest"}]' || inputs.systems == 'x86_64-linux' && '[{"system":"x86_64-linux","os":"ubuntu-latest"}]' || inputs.systems == 'aarch64-linux' && '[{"system":"aarch64-linux","os":"ubuntu-24.04-arm"}]' || inputs.systems == 'aarch64-darwin' && '[{"system":"aarch64-darwin","os":"macos-latest"}]' || '[{"system":"x86_64-linux","os":"ubuntu-latest"},{"system":"aarch64-linux","os":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","os":"macos-latest"}]') }}

    env:
      NIX_PATH: nixpkgs=channel:nixos-unstable

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Checkout FluentCI tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tooling
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.ci-tooling/.github/actions/fluentci-toolchain
      - name: Checkout requested source
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: .source

      - uses: actions/checkout@v4
        if: runner.os == 'macOS'
        with:
          ref: ${{ inputs.ref || github.ref }}

          clean: false
      - name: Set up determinate-nix
        run: fluentci run setup-determinate-nix setup --sudo --trusted-users '["runner"]' --extra-conf '["experimental-features = nix-command flakes"]' | node "$GITHUB_WORKSPACE/.ci-tooling/.fluentci/github-env.mjs"
        shell: bash
        if: runner.os == 'macOS'
      - name: Configure Cachix with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation setup --cache tsirysndr
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        if: runner.os == 'macOS'
      - name: Build nix/package.nix
        if: runner.os == 'macOS'
        run: nix-build -E 'with import <nixpkgs> { }; callPackage ./nix/package.nix { }'

      - name: Set up the pinned Dagger beta with FluentCI
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci setup-dagger
        shell: bash
        if: runner.os == 'Linux'
      - name: Run container pipeline with FluentCI
        if: runner.os == 'Linux'
        uses: ./.ci-tooling/.github/actions/dagger
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          module: ci
          key: nix-package
          volumes: smolsonic-nix-store
          command: |-
            fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci dagger --directory "$GITHUB_WORKSPACE/.dagger" --arguments '["--progress","logs","-v","api","call","-m","ci","nix-package","--source","../.source","--cachix-token","env://CACHIX_AUTH_TOKEN","--run-id","$WORKFLOW_RUN"]'
      - name: Push result to Cachix
        run: fluentci run --work-dir "$GITHUB_WORKSPACE/.ci-tooling" ci cachix --directory "$GITHUB_WORKSPACE" --operation push --cache tsirysndr
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
        if: runner.os == 'macOS'
    defaults:
      run:
        shell: bash

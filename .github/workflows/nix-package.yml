name: Nix package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build from"
        required: false
        type: string
      systems:
        description: "Which systems to build on"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - x86_64-linux
          - aarch64-linux
          - aarch64-darwin

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.systems == 'linux' && '[{"system":"x86_64-linux","os":"ubuntu-latest"},{"system":"aarch64-linux","os":"ubuntu-24.04-arm"}]' || inputs.systems == 'macos' && '[{"system":"aarch64-darwin","os":"macos-latest"}]' || inputs.systems == 'x86_64-linux' && '[{"system":"x86_64-linux","os":"ubuntu-latest"}]' || inputs.systems == 'aarch64-linux' && '[{"system":"aarch64-linux","os":"ubuntu-24.04-arm"}]' || inputs.systems == 'aarch64-darwin' && '[{"system":"aarch64-darwin","os":"macos-latest"}]' || '[{"system":"x86_64-linux","os":"ubuntu-latest"},{"system":"aarch64-linux","os":"ubuntu-24.04-arm"},{"system":"aarch64-darwin","os":"macos-latest"}]') }}

    env:
      NIX_PATH: nixpkgs=channel:nixos-unstable

    steps:
      - name: Checkout pipeline
        if: runner.os == 'Linux'
        uses: actions/checkout@v4

      - name: Checkout requested source
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: .source

      - uses: actions/checkout@v4
        if: runner.os == 'macOS'
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: DeterminateSystems/nix-installer-action@v16
        if: runner.os == 'macOS'

      - name: Setup Cachix
        if: runner.os == 'macOS'
        uses: cachix/cachix-action@v17
        with:
          name: tsirysndr
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build nix/package.nix
        if: runner.os == 'macOS'
        run: nix-build -E 'with import <nixpkgs> { }; callPackage ./nix/package.nix { }' --no-out-link

      - name: Install Dagger
        if: runner.os == 'Linux'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: v1.0.0-beta.21

      - name: Run PureScript Dagger pipeline
        if: runner.os == 'Linux'
        uses: ./.github/actions/dagger
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          module: ci
          key: nix-package
          volumes: smolsonic-nix-store
          command: |
            dagger --progress logs -v api call -m ci nix-package --source ../.source --cachix-token env://CACHIX_AUTH_TOKEN --run-id "$WORKFLOW_RUN"
